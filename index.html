// Fenêtres qui contiennent une saisie : le rafraîchissement automatique ne les redessine pas.
const FEUILLES_SAISIE = ['invite','profil','nip','presence_maison','mes_heures','suggestion','banque','plat','plats_multi'];
function ouvrir(type, args){ S.sheet = {type, ...args}; dessinerFeuille(); }
function fermer(){ S.sheet = null; $('#sheet').hidden = true; $('#sheet-card').innerHTML = ''; }
function dessinerFeuille(){
  if (!S.sheet) return;
  const f = FEUILLES[S.sheet.type](S.sheet);
  $('#sheet-card').innerHTML = `<div class="sheet-h"><b>${f.titre}</b><button class="x" data-a="close" aria-label="Fermer">✕</button></div>${f.corps}`;
  $('#sheet').hidden = false;
}

/* ---------- Fenêtre de confirmation (remplace confirm() du navigateur, dont le titre ne se change pas) ---------- */
// demander({titre, message, oui, non, danger, icone}) → promesse : true si on confirme.
let _finDlg = null;
function demander({titre, message, oui = 'OK', non = 'Annuler', danger = false, icone = ''}){
  const d = $('#dialogue');
  $('#dlg-t').innerHTML = `${icone}<span>${esc(titre)}</span>`;
  $('#dlg-m').textContent = message;
  const bOui = d.querySelector('.btn[data-dlg="oui"]'), bNon = d.querySelector('.btn[data-dlg="non"]');
  bOui.textContent = oui; bOui.className = `btn ${danger ? 'danger' : 'ghost'}`;
  bNon.textContent = non;
  if (_finDlg) _finDlg(false);
  d.hidden = false; bNon.focus();
  return new Promise(res => { _finDlg = res; });
}
function finDialogue(oui){
  const d = $('#dialogue'); if (d.hidden) return;
  d.hidden = true; const f = _finDlg; _finDlg = null; if (f) f(oui);
}

/* ---------- Rendu principal ---------- */
function render(){
  if (!S.sess || !S.data) return;
  if (!VUES[S.tab]) S.tab = 'auj';
  $('#app').innerHTML = VUES[S.tab]();
  $('#nav').hidden = false;
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  if (S.sheet && !FEUILLES_SAISIE.includes(S.sheet.type)) dessinerFeuille();
}
async function refresh(){
  const t = today();
  S.data = await rpc('donnees', {p_jeton:S.sess.jeton, p_debut:addDays(t,-1), p_fin:addDays(t, Math.max(21, S.semaine*7 + 8))});
  render();
}
function deconnecterLocal(){ S.sess = null; S.data = null; LS.del(CLE_SESSION); fermer(); L.membres = null; L.choisi = null; renderLogin(); }

/* ---------- Connexion (NIP) ---------- */
const L = {membres:null, choisi:null, nip:'', etape:'nip', premier:''};
async function renderLogin(){
  $('#nav').hidden = true;
  const app = $('#app');
  if (!L.membres){
    app.innerHTML = '<div class="center muted">Chargement…</div>';
    try { L.membres = await rpc('list_membres'); }
    catch(e){ app.innerHTML = `<div class="card">Impossible de joindre la base de données : ${esc(e.message)}<div class="actions"><button class="btn sm" data-a="relancer">Réessayer</button></div></div>`; return; }
  }
  if (!L.choisi){
    app.innerHTML = `<div class="login"><div style="font-size:3rem">🍽️</div><h1>Repas en famille</h1><p class="muted">Qui es-tu ?</p>
      ${DEMO ? '<div class="banner demo">🧪 Mode démo : choisis un NIP à 4 chiffres à ta première connexion.</div>' : ''}
      <div class="tiles">${L.membres.map(m => `<button class="tile ${m.couleur}" data-a="login-m" data-m="${m.id}"><span class="e">${renderEmoji(m.emoji, m.prenom)}</span>${esc(m.prenom)}</button>`).join('')}</div></div>`;
    return;
  }
  const m = L.choisi;
  const msg = {nip:'Entre ton NIP', creer:'Première connexion : choisis ton NIP (4 chiffres)', confirmer:'Confirme ton nouveau NIP'}[L.etape];
  const k = ['1','2','3','4','5','6','7','8','9','','0','del'];
  app.innerHTML = `<div class="login"><div style="font-size:3rem">${renderEmoji(m.emoji, m.prenom)}</div><h1>${esc(m.prenom)}</h1><p class="muted">${msg}</p>
    <div class="dots">${[0,1,2,3].map(i => `<i class="${i < L.nip.length ? 'f' : ''}"></i>`).join('')}</div>
    <div class="keypad">${k.map(x => x === '' ? '<button class="v" tabindex="-1"></button>' : `<button data-a="pin" data-k="${x}" aria-label="${x === 'del' ? 'Effacer' : x}">${x === 'del' ? '⌫' : x}</button>`).join('')}</div>
    <button class="linkbtn" data-a="oubli">NIP oublié ?</button><br><button class="linkbtn" data-a="login-back">← Ce n'est pas moi</button></div>`;
}
async function touchePin(k){
  if (k === 'del'){ L.nip = L.nip.slice(0,-1); return renderLogin(); }
  if (L.nip.length >= 4) return;
  L.nip += k; renderLogin();
  if (L.nip.length < 4) return;
  if (L.etape === 'creer'){ L.premier = L.nip; L.nip = ''; L.etape = 'confirmer'; return setTimeout(renderLogin, 150); }
  if (L.etape === 'confirmer' && L.nip !== L.premier){ toast('Les deux NIP ne correspondent pas. Recommence.'); L.nip = ''; L.etape = 'creer'; return setTimeout(renderLogin, 150); }
  try {
    const r = await rpc('connexion', {p_membre:L.choisi.id, p_nip:L.nip});
    if (r && r.erreur){ toast('⚠️ ' + r.erreur, 4000); L.nip = ''; return renderLogin(); }
    S.sess = {jeton:r.jeton, membre:L.choisi.id}; LS.set(CLE_SESSION, S.sess);
    L.choisi = null; L.nip = '';
    await refresh();
  } catch(e){ toast('⚠️ ' + e.message, 5000); L.nip = ''; renderLogin(); }
}

/* ---------- Événements ---------- */
let _tt;
function toast(msg, ms = 2600){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(_tt); _tt = setTimeout(() => t.classList.remove('on'), ms); }
async function copier(txt){
  try { await navigator.clipboard.writeText(txt); toast('📋 Copié'); }
  catch(e){ prompt('Copie ce texte :', txt); }
}
document.addEventListener('click', async e => {
  const dlg = e.target.closest('[data-dlg]');
  if (dlg){ finDialogue(dlg.dataset.dlg === 'oui'); return; }
  const emojiChoice = e.target.closest('.emoji-option');
  if (emojiChoice) {
    const field = document.getElementById('p-e');
    if (field) {
      const value = emojiChoice.dataset.emojiValue;
      field.value = value;
      const preview = document.getElementById('p-e-preview');
      if (preview) preview.innerHTML = renderEmoji(value, 'emoji');
      document.querySelectorAll('.emoji-option').forEach(btn => btn.classList.toggle('on', btn === emojiChoice));
      field.focus();
    }
    return;
  }
  const el = e.target.closest('[data-a]'); if (!el) return;
  const d = el.dataset;
  switch (d.a){
    case 'tab': S.tab = d.tab; S.modif = false; LS.set('repas-onglet', S.tab); render(); scrollTo(0,0); break;
    case 'close': fermer(); break;
    case 'set': el.disabled = true; await act('enregistrer_presence', {p_membre:d.m, p_jour:d.j, p_champ:d.c, p_valeur:d.v}); el.disabled = false; break;
    case 'person': ouvrir('person', {m:d.m, j:d.j}); break;
    case 'periode-maison': ouvrir('presence_maison', {m:d.m, j:d.j}); break;
    case 'mes-heures': ouvrir('mes_heures', {}); break;
    case 'modifier-reponses': S.modif = true; render(); break;
    case 'replier-reponses': S.modif = false; render(); break;
    case 'day': ouvrir('day', {j:d.j}); break;
    case 'invite': ouvrir('invite', {j:d.j}); break;
    case 'suggerer': ouvrir('suggestion', {j:d.j}); break;
    case 'choisir-plat': {
      // Un repas de la banque touché sous « Repas » : on remplit le nom et ses ingrédients.
      const f = el.closest('form'), pl = platParId(d.id); if (!f || !pl) break;
      f.elements.titre.value = pl.nom;
      if (pl.ingredients) f.elements.ingredients.value = pl.ingredients;
      f.elements.titre.dispatchEvent(new Event('input', {bubbles:true}));
      break;
    }
    case 'banque': S.banqueQ = ''; ouvrir('banque', {}); break;
    case 'plat': ouvrir('plat', {id:d.id, retour:d.retour || 'banque', j:d.j}); break;
    case 'plat-nouveau': ouvrir('plat', {id:null, nom:d.nom || '', retour:d.retour || 'banque', j:d.j}); break;
    case 'plats-multi': ouvrir('plats_multi', {}); break;
    case 'plat-retirer': {
      const pl = platParId(d.id); if (!pl) break;
      if (await demander({titre:'Retirer de la banque', icone:ICONE_POUBELLE, message:`Retirer ${pl.nom} de la banque ? Ses articles seront effacés. Les suggestions déjà faites gardent leur nom.`, oui:'Retirer', danger:true})
          && await act('supprimer_plat', {p_id:pl.id}, 'Repas retiré de la banque')) ouvrir('banque', {});
      break;
    }
    case 'panier': ouvrir('panier', {j:d.j}); break;
    case 'epi-jour': S.epiJours = S.epiJours.includes(d.j) ? S.epiJours.filter(x => x !== d.j) : [...S.epiJours, d.j]; render(); break;
    case 'epi-semaine': S.epiJours = [...Array(7)].map((_, i) => addDays(today(), i)); render(); break;
    case 'epi-aucun': S.epiJours = []; render(); break;
    case 'del-invite': if (confirm('Retirer cet invité du souper ?')) await act('supprimer_invite', {p_id:d.id}, 'Invité retiré'); break;
    case 'goto-repas': S.repasJour = d.j; S.tab = 'repas'; fermer(); render(); scrollTo(0,0); break;
    case 'repas-jour': S.repasJour = d.j; render(); break;
    case 'ouvrir-heure': ouvrir('heure_souper', {j:d.j}); break;
    case 'effacer-heure': if (await act('enregistrer_heure_souper', {p_jour:d.j, p_heure:''}, 'Heure du souper retirée')) fermer(); break;
    case 'choisir': {
      // Remplacer un souper déjà décidé demande une confirmation.
      const s = S.data.suggestions.find(x => x.id === d.id), r = s && repasChoisi(s.jour);
      if (r && r.id !== d.id && !(await demander({titre:'Remplacer le souper', message:`Remplacer ${r.titre} par ${s.titre} comme souper ?`, oui:'Remplacer'}))) break;
      await act('choisir_repas', {p_id:d.id}, '✅ Repas décidé'); break;
    }
    case 'autres': S.autres[d.j] = !S.autres[d.j]; render(); break;
    case 'voter': el.disabled = true; await act('voter_repas', {p_id:d.id}, '👍 Vote enregistré'); el.disabled = false; break;
    case 'retirer-vote': el.disabled = true; await act('retirer_vote', {p_jour:d.j}, 'Vote retiré'); el.disabled = false; break;
    case 'retirer-choix': if (await demander({titre:'Annuler la décision', message:'Annuler la décision pour ce jour ?', oui:'Annuler la décision', non:'Garder la décision'})) await act('retirer_choix', {p_jour:d.j}, 'Décision annulée'); break;
    case 'del-sugg': {
      // La confirmation dit ce qui sera perdu : les votes, et la décision s'il y en a une.
      const s = S.data.suggestions.find(x => x.id === d.id); if (!s) break;
      const n = votantsDe(s.id).length;
      const msg = `Supprimer ${s.titre} ?` + (n === 1 ? ' Le vote sera effacé.' : n > 1 ? ` Les ${n} votes seront effacés.` : '') + (s.choisi ? ' Le souper ne sera plus décidé.' : '');
      if (await demander({titre:'Supprimer la suggestion', icone:ICONE_POUBELLE, message:msg, oui:'Supprimer', danger:true})) await act('supprimer_suggestion', {p_id:d.id}, 'Suggestion supprimée');
      break;
    }
    case 'sem': S.semaine = Math.max(0, S.semaine + (+d.d)); try { await refresh(); } catch(err){ toast('⚠️ ' + err.message); } break;
    case 'profil': ouvrir('profil', {m:d.m}); break;
    case 'ajouter-membre': ouvrir('ajouter_membre', {}); break;
    case 'supprimer-membre': if (confirm(`Supprimer ${prenom(d.m)} de la famille ?`)) await act('supprimer_membre', {p_membre:d.m}, 'Membre supprimé'); break;
    case 'reset-nip': if (confirm(`Réinitialiser le NIP de ${prenom(d.m)} ? Cette personne choisira un nouveau NIP à sa prochaine connexion.`)) await act('reinitialiser_nip', {p_membre:d.m}, '🔑 NIP réinitialisé'); break;
    case 'nip': ouvrir('nip', {}); break;
    case 'copier': copier(d.txt); break;
    case 'rafraichir': try { await refresh(); toast('À jour ✓'); } catch(err){ toast('⚠️ ' + err.message); } break;
    case 'logout': if (confirm('Se déconnecter de ce téléphone ?')){ rpc('deconnexion', {p_jeton:S.sess.jeton}).catch(() => {}); deconnecterLocal(); } break;
    case 'demo-reset': if (confirm('Effacer toutes les données de démonstration ?')){ Demo.reset(); deconnecterLocal(); } break;
    case 'login-m': L.choisi = L.membres.find(m => m.id === d.m); L.nip = ''; L.etape = L.choisi.a_nip ? 'nip' : 'creer'; renderLogin(); break;
    case 'login-back': L.choisi = null; L.nip = ''; renderLogin(); break;
    case 'pin': touchePin(d.k); break;
    case 'oubli': toast('Demande à Nadine ou à Marc : onglet Famille → « Réinitialiser le NIP ». Tu pourras ensuite en choisir un nouveau.', 7000); break;
    case 'relancer': L.membres = null; renderLogin(); break;
  }
});
document.addEventListener('submit', async e => {
  const f = e.target; if (!f.dataset.f) return;
  e.preventDefault();
  const v = Object.fromEntries(new FormData(f));
  const btn = f.querySelector('button'); if (btn) btn.disabled = true;
  let ok = false;
  switch (f.dataset.f){
    case 'sugg': {
      // Si le repas est déjà dans la banque (même clé), on prend son nom et, au besoin, ses ingrédients.
      const pl = clePlat(v.titre) ? (S.data.plats || []).find(x => x.cle === clePlat(v.titre)) : null;
      const titre = pl ? pl.nom : v.titre.trim(), ingr = (v.ingredients || '').trim() || (pl ? pl.ingredients : '');
      // Doublon le même jour (même clé que la banque : « Tacos poulet » = « Tacos au poulet ») : on avertit, on laisse ajouter.
      const cle = x => clePlat(x) || norm(x).trim();
      const dbl = S.data.suggestions.find(x => x.jour === f.dataset.j && cle(x.titre) === cle(titre));
      if (dbl && !(await demander({titre:'Repas déjà suggéré', message:`${dbl.titre} est déjà suggéré ce jour-là.${voteOuvert(f.dataset.j) ? ' Vote plutôt pour lui!' : ''} Ajouter quand même ?`, oui:'Ajouter quand même'}))) break;
      ok = await act('proposer_repas', {p_jour:f.dataset.j, p_titre:titre, p_ingredients:ingr, p_choisir:!!v.choisir}, v.choisir ? '✅ Repas décidé' : '💡 Suggestion ajoutée');
      if (ok && S.sheet && S.sheet.type === 'suggestion') fermer();
      break;
    }
    case 'plat': {
      const id = f.dataset.id || null;
      const articles = String(v.articles || '').split('\n').map(x => x.trim()).filter(Boolean);
      ok = await act('enregistrer_plat', {p_id:id, p_nom:String(v.nom || '').trim(), p_ingredients:String(v.ingredients || '').trim(), p_articles:articles}, id ? '✅ Repas enregistré' : '✅ Repas ajouté à la banque');
      if (ok){
        // Retour à la fenêtre d'où l'on venait (banque ou panier), sinon on ferme.
        const r = S.sheet && S.sheet.retour, j = S.sheet && S.sheet.j;
        if (r === 'banque') ouvrir('banque', {}); else if (r === 'panier') ouvrir('panier', {j}); else fermer();
      }
      break;
    }
    case 'plats-multi': {
      const noms = String(v.noms || '').split('\n').map(x => x.trim()).filter(Boolean);
      if (!noms.length){ toast('Écris au moins un repas, un par ligne.'); break; }
      try {
        const r = await rpc('ajouter_plats', {p_jeton:S.sess.jeton, p_noms:noms});
        const ex = r.existants || [];
        toast(`✅ ${r.ajoutes} repas ajouté${r.ajoutes > 1 ? 's' : ''}${ex.length ? ` · déjà dans la banque : ${ex.join(', ')}` : ''}`, 7000);
        await refresh(); ok = true; ouvrir('banque', {});
      } catch(e){ toast('⚠️ ' + e.message, 5000); }
      break;
    }
    case 'heure-picker': {
      const heure = `${v.heure_h}:${v.heure_m}`;
      ok = await act('enregistrer_heure_souper', {p_jour:f.dataset.j, p_heure:heure}, `Heure du souper enregistrée : ${heure}`);
      if (ok) fermer();
      break;
    }
    case 'presence-maison': {
      const arriveeH = String(v.arrivee_h || ''), arriveeM = String(v.arrivee_m || '');
      const departH = String(v.depart_h || ''), departM = String(v.depart_m || '');
      if (!!arriveeH !== !!arriveeM || !!departH !== !!departM) { toast('Choisis une heure et des minutes, ou laisse les deux vides.'); break; }
      const arrivee = arriveeH ? `${arriveeH}:${arriveeM}` : '';
      const depart = departH ? `${departH}:${departM}` : '';
      if (arrivee && depart && arrivee > depart) { toast('L’arrivée doit être avant le départ.'); break; }
      ok = await act('enregistrer_presence_maison', {p_membre:f.dataset.m, p_jour:f.dataset.j, p_arrivee:arrivee, p_depart:depart}, 'Période à la maison enregistrée');
      if (ok) fermer();
      break;
    }
    case 'mes-heures': {
      const t = today(), dm = addDays(t, 1);
      const hm = (h, m) => { h = String(h || ''); m = String(m || ''); if (!!h !== !!m) return null; return h ? `${h}:${m}` : ''; };
      const a1 = hm(v.a1_h, v.a1_m), d1 = hm(v.d1_h, v.d1_m), a2 = hm(v.a2_h, v.a2_m), d2 = hm(v.d2_h, v.d2_m);
      if ([a1, d1, a2, d2].includes(null)) { toast('Choisis une heure et des minutes, ou laisse les deux vides.'); break; }
      if (a1 && d1 && a1 > d1) { toast("Aujourd'hui : l’arrivée doit être avant le départ."); break; }
      if (a2 && d2 && a2 > d2) { toast("Demain : l’arrivée doit être avant le départ."); break; }
      ok = await act('enregistrer_presence_maison', {p_membre:S.data.moi, p_jour:t, p_arrivee:a1, p_depart:d1});
      if (ok) ok = await act('enregistrer_presence_maison', {p_membre:S.data.moi, p_jour:dm, p_arrivee:a2, p_depart:d2}, 'Heures à la maison enregistrées');
      if (ok) fermer();
      break;
    }
    case 'invite':
      ok = await act('enregistrer_invite', {p_id:null, p_jour:f.dataset.j, p_nom:v.nom.trim(), p_allergies:liste(v.allergies), p_naime_pas:liste(v.naime_pas)}, '🎟️ Invité ajouté');
      if (ok) fermer(); break;
    case 'profil':
      ok = await act('enregistrer_profil', {p_membre:f.dataset.m, p_emoji:v.emoji.trim() || '🙂', p_aime:v.aime.trim(), p_naime_pas:liste(v.naime_pas), p_allergies:liste(v.allergies)}, 'Profil enregistré');
      if (ok) fermer(); break;
    case 'ajouter-membre':
      if (!String(v.prenom || '').trim()) { toast('Le prénom est obligatoire.'); break; }
      ok = await act('ajouter_membre', {p_prenom:String(v.prenom || '').trim(), p_emoji:String(v.emoji || '').trim() || '🙂', p_couleur:String(v.couleur || 'rose'), p_parent:!!v.parent}, 'Membre ajouté');
      if (ok) fermer(); break;
    case 'nip':
      if (v.n1 !== v.n2){ toast('Les deux NIP ne correspondent pas.'); break; }
      ok = await act('changer_nip', {p_nouveau:v.n1}, '🔑 NIP changé');
      if (ok) fermer(); break;
  }
  if (btn && document.body.contains(btn)) btn.disabled = false;
});
document.addEventListener('input', e => {
  if (e.target.matches('[data-banque]')){ S.banqueQ = e.target.value; $('#banque-liste').innerHTML = listeBanque(S.banqueQ); return; }
  const f = e.target.form;
  if (!f || f.dataset.f !== 'sugg') return;
  if (e.target.name === 'titre') f.querySelector('.choix-banque').innerHTML = htmlChoixBanque(e.target.value);
  const txt = `${f.elements.titre.value} ${f.elements.ingredients.value}`.trim();
  f.querySelector('.apercu').innerHTML = txt ? resumeFlags(f.dataset.j, txt) : '';
});
document.addEventListener('keydown', e => {
  if (!S.sess && L.choisi){
    if (/^[0-9]$/.test(e.key)) touchePin(e.key);
    else if (e.key === 'Backspace') touchePin('del');
  } else if (e.key === 'Escape' && !$('#dialogue').hidden) finDialogue(false);
  else if (e.key === 'Escape' && S.sheet) fermer();
});

/* ---------- Mise à jour automatique ---------- */
function occupe(){
  if (!$('#dialogue').hidden) return true;
  const a = document.activeElement;
  if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return true;
  if (S.sheet && FEUILLES_SAISIE.includes(S.sheet.type)) return true;
  return [...document.querySelectorAll('#app input[type=text]')].some(i => i.value.trim());
}
setInterval(() => { if (S.sess && document.visibilityState === 'visible' && !occupe()) refresh().catch(() => {}); }, 60000);
document.addEventListener('visibilitychange', () => { if (S.sess && document.visibilityState === 'visible' && !occupe()) refresh().catch(() => {}); });

/* ---------- Démarrage ---------- */
(async function init(){
  if (!S.sess) return renderLogin();
  try { await refresh(); }
  catch(e){
    if (!S.sess) return;
    $('#app').innerHTML = `<div class="card">⚠️ ${esc(e.message)}<div class="actions"><button class="btn sm" data-a="rafraichir">Réessayer</button></div></div>`;
  }
})();
</script>
