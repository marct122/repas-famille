<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Repas en famille</title>
<meta name="description" content="Qui soupe ce soir, qui a besoin d'un lunch demain et ce qu'on mange.">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Repas">
<script src="config.js"></script>
<style>
:root{
  --bg:#f3f5fa;--card:#fff;--ink:#1d2433;--muted:#667085;--line:#e4e8f0;--cadre:#cbd3e0;
  --bleu:#2563eb;--bleu-bg:#e7efff;--rose:#db2777;--rose-bg:#fde7f1;
  --ok:#15803d;--ok-bg:#dcfce7;--no:#dc2626;--no-bg:#fee2e2;--warn:#b45309;--warn-bg:#fef3c7;
  --accent:#2563eb;--shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1420;--card:#1a2130;--ink:#e8ecf4;--muted:#9aa4b8;--line:#2a3345;--cadre:#3e4b66;
  --bleu:#7aa7ff;--bleu-bg:#1c2b4a;--rose:#f472b6;--rose-bg:#3a1d2e;
  --ok:#4ade80;--ok-bg:#16301f;--no:#f87171;--no-bg:#3a1c1c;--warn:#fbbf24;--warn-bg:#3a2d12;
  --accent:#7aa7ff;--shadow:none;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(80px + env(safe-area-inset-bottom))}
#app{max-width:560px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px 24px}
button{font:inherit;color:inherit}
.top{display:flex;align-items:flex-end;gap:8px;margin:6px 0 4px}
.top h1{font-size:1.5rem;margin:0}
.top .sub{color:var(--muted);font-size:.95rem}
h2{font-size:1.15rem;margin:22px 0 4px}
h3{font-size:1.02rem;margin:0 0 10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line);padding:14px;margin:12px 0}
.card.todo{border:2px solid var(--warn)}
.muted{color:var(--muted)}
.small{font-size:.84rem;color:var(--muted)}
.grow{flex:1}
.tap{cursor:pointer}
.who{display:inline-flex;align-items:center;gap:4px;font-weight:600;padding:2px 10px 2px 7px;border-radius:999px;white-space:nowrap;font-size:.95rem}
.who.bleu{background:var(--bleu-bg);color:var(--bleu)}
.who.rose{background:var(--rose-bg);color:var(--rose)}
.who.invite{background:var(--warn-bg);color:var(--warn)}
.who.attend{background:transparent;border:1.5px dashed currentColor;padding:1px 9px 1px 6px}
.cat-n{font-size:.84rem;color:var(--muted);margin:-2px 0 4px}
.row{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.list .row:first-child{border-top:0}
.flags{flex-basis:100%;display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.pill{font-size:.94rem;font-weight:700;padding:4px 11px;border-radius:999px;white-space:nowrap}
.pill.present{background:var(--ok-bg);color:var(--ok)}
.pill.absent,.pill.auto{background:var(--no-bg);color:var(--no)}
.pill.attente{background:var(--warn-bg);color:var(--warn)}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:44px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;font-weight:600;padding:6px 6px;cursor:pointer}
.seg button:disabled{opacity:.5;cursor:default}
.seg button.on{border-color:transparent}
.seg .on.present,.seg .on.froid,.seg .on.chaud{background:var(--ok-bg);color:var(--ok)}
.seg .on.absent{background:var(--no-bg);color:var(--no)}
.seg .on.aucun{background:var(--line)}
.seg.mini button{min-height:44px;font-size:.9rem;padding:2px 4px;border-radius:10px}
.rep{padding:10px 0;border-top:1px solid var(--line)}
.rep:first-of-type{border-top:0;padding-top:0}
.rep-t{font-weight:700;margin-bottom:6px}
.rep .small{margin-top:5px}
.flag{font-size:.9rem;border-radius:8px;padding:5px 9px;display:inline-block}
.flag.all{background:var(--no-bg);color:var(--no);font-weight:700}
.flag.dis{background:var(--warn-bg);color:var(--warn)}
.flag.ok{background:var(--ok-bg);color:var(--ok)}
.late{color:var(--warn);font-weight:600}
.meal{border-radius:12px;padding:11px 12px;background:var(--ok-bg);margin-bottom:10px}
.meal.pending{background:var(--warn-bg);color:var(--warn)}
.meal-t{font-weight:700;font-size:1.08rem}
.count{margin:4px 0 2px}
.lg{padding:8px 0;border-top:1px solid var(--line)}
.lg:first-of-type{border-top:0;padding-top:0}
.lg-t{font-weight:600;margin-bottom:5px}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.6}
.btn.ghost{background:var(--bleu-bg);color:var(--bleu)}
.btn.danger{background:var(--no-bg);color:var(--no)}
.btn.ok{background:var(--ok-bg);color:var(--ok)}
.btn.sm{min-height:44px;padding:6px 12px;font-size:.92rem;border-radius:10px}
.btn.full{width:100%}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.card > .btn.ghost.sm{margin-top:8px}
input[type=text],input[type=password],textarea{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
textarea{min-height:64px;resize:vertical}
label.f{display:block;font-weight:600;margin:12px 0 4px;font-size:.9rem}
label.chk{display:flex;gap:8px;align-items:center;margin:12px 0;font-weight:600}
.emoji-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:8px 0 12px}
.emoji-option{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:8px 4px;cursor:pointer;font-size:1.6rem;display:flex;align-items:center;justify-content:center;min-height:48px;transition:transform .15s ease, border-color .15s ease, background .15s ease}
.emoji-option.on{border-color:var(--accent);background:var(--bleu-bg);transform:translateY(-1px)}
.custom-emoji{display:inline-block;width:1.4em;height:1.4em;object-fit:cover;vertical-align:middle;border-radius:8px;background:#fff}
.preview-emoji{display:flex;align-items:center;justify-content:center;min-height:52px;border:1.5px dashed var(--line);background:var(--bg);border-radius:12px;margin:8px 0 12px;font-size:1.8rem}
.time-display{width:120px;min-height:44px;max-width:100%;flex:0 0 120px;display:inline-flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-variant-numeric:tabular-nums;cursor:pointer}
.time-select-row{display:flex;align-items:center;justify-content:center;gap:10px;margin:18px 0}
.time-select-row label{width:110px}
.time-select-row select{width:100%;min-height:48px;padding:8px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:1.1rem}
.hint{font-size:.8rem;color:var(--muted);margin-top:4px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:8px -16px 0;padding:2px 16px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:6px 10px;text-align:center;cursor:pointer;line-height:1.2;font-size:.85rem}
.chip b{display:block;font-size:1rem}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .dot{display:block;font-size:.7rem;height:.9rem}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--bleu-bg);color:var(--bleu)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.sugg{border:1.5px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.sugg.chosen{border-color:var(--ok);background:var(--ok-bg)}
.sugg .flag{margin-top:6px}
.vote{border-top:1px solid var(--line);padding:8px 0 2px;margin-top:8px}
.vote-t{font-weight:700}
.vote-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.vote-info{flex:1 1 140px;min-width:0}
.vote-btns{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;margin-left:auto}
.btn.neutre{background:var(--line);color:var(--ink)}
.vote-zone{border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.vote-zone-t{font-weight:800;font-size:1.05rem;margin-bottom:2px}
.sugg-btn{margin-bottom:10px}
/* Banque de repas, recherche en temps réel, épicerie */
.choix-banque{margin-top:6px}
.choix-info{margin:2px 0 4px}
.choix-liste{display:flex;flex-direction:column;gap:4px}
.choix{display:block;width:100%;text-align:left;min-height:44px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.choix.on{border-color:var(--ok);background:var(--ok-bg)}
.plat-ligne{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;min-height:44px;padding:10px 12px;margin-top:6px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.articles{margin:6px 0 0;padding-left:22px}
.articles li{padding:3px 0}
.meal-panier{display:flex;align-items:center;gap:8px}
.btn-icone.panier{background:var(--card);color:var(--bleu)}
.epi-souper{padding:8px 0;border-top:1px solid var(--line)}
.epi-souper:first-of-type{border-top:0}
/* Page Repas : carte de suggestion */
.sugg-h{display:flex;align-items:flex-start;gap:8px}
.sugg-h > div{flex:1;min-width:0}
.btn-icone{flex:none;width:44px;height:44px;border-radius:999px;border:0;background:var(--no-bg);color:var(--no);font-size:1.1rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.tag.ok{background:var(--ok);color:var(--card);margin-bottom:4px}
.alertes{margin-top:4px}
.alerte{font-size:.9rem;padding:2px 0}
.alerte.all{color:var(--no);font-weight:700}
.alerte.dis{color:var(--warn)}
.alerte.ok{color:var(--muted);font-size:.84rem}
.ligne-parents{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
.ligne-parents .lp-t{color:var(--muted);font-size:.84rem}
.ligne-parents .lp-b{margin-left:auto}
.autres-toggle{width:100%;min-height:44px;background:none;border:0;color:var(--ink);font:inherit;font-weight:700;text-align:left;cursor:pointer;padding:8px 2px}
.card.done{border:1.5px solid var(--ok);background:var(--ok-bg)}
.card.done .btn.ok{background:var(--ok);color:#fff}
.hdr{font-weight:800;font-size:1.2rem;color:var(--ink);margin-bottom:8px}
.sub-h{font-weight:700;margin:4px 0 6px}
.line{padding:4px 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chev{color:var(--muted);font-weight:700}
.sep{border-top:1px solid var(--line);margin:12px 0}
/* Accueil : un cadre autour de la section Lunchs, un autre autour de la section Souper */
.cadre{border:1.5px solid var(--cadre);border-radius:12px;padding:10px 10px 8px;margin-top:10px}
.cadre > .sub-h:first-child{margin-top:0}
.banner{border-radius:12px;padding:10px 12px;font-size:.9rem;margin:8px 0}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.info{background:var(--bleu-bg);color:var(--bleu)}
.banner.demo{background:var(--rose-bg);color:var(--rose)}
.day-h{display:flex;align-items:center;gap:8px;font-weight:700}
.mine{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;margin-top:10px;font-size:.88rem}
.dinner-time{margin:-4px 0 10px}
.home-range{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.home-edit{margin:2px 0 4px}
.week-home{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:9px}
.home-window{padding:10px 0;border-top:1px solid var(--line)}
.home-window:first-child{border-top:0}
.home-window-title{display:flex;justify-content:space-between;gap:8px;margin-bottom:5px;font-weight:600}
.home-time-fields{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;max-width:250px}
.home-time-fields select{width:100%;min-width:0;min-height:44px;padding:8px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.weeknav{display:flex;align-items:center;gap:8px;margin-top:8px}
.weeknav .btn{min-width:44px}
.pchip{display:inline-block;font-size:.82rem;padding:2px 9px;border-radius:999px;margin:2px 4px 2px 0}
.pchip.dis{background:var(--warn-bg);color:var(--warn)}
.pchip.all{background:var(--no-bg);color:var(--no);font-weight:700}
.code{font-family:ui-monospace,Consolas,monospace;background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;word-break:break-all;font-size:.9rem;margin:6px 0}
ol.steps{padding-left:20px;margin:8px 0}
ol.steps li{margin:4px 0}
nav#nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav#nav[hidden]{display:none}
nav#nav button{flex:1;max-width:112px;background:none;border:0;color:var(--muted);font-size:.72rem;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
nav#nav button span{font-size:1.35rem;line-height:1.2}
nav#nav button.on{color:var(--accent);font-weight:700}
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet-card{position:relative;background:var(--bg);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:14px 16px calc(22px + env(safe-area-inset-bottom))}
.sheet-h{display:flex;align-items:center;gap:8px;font-size:1.08rem;margin-bottom:6px}
.sheet-h b{flex:1}
.x{background:var(--card);border:1px solid var(--line);border-radius:999px;width:36px;height:36px;cursor:pointer}
/* Fenêtre de confirmation de l'app (au-dessus des fenêtres du bas) */
.dlg{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg[hidden]{display:none}
.dlg-bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.dlg-card{position:relative;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:18px 16px 14px;width:100%;max-width:400px}
.dlg-t{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.1rem;margin-bottom:8px}
.dlg-t svg{color:var(--no);flex:none}
.dlg-m{line-height:1.45}
.dlg-b{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:16px}
.dlg-b .btn{min-width:110px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1d2433;color:#fff;padding:10px 16px;border-radius:12px;width:max-content;max-width:min(92vw,520px);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;font-size:.92rem;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast.on{opacity:1}
.login{text-align:center;padding-top:24px}
.login h1{font-size:1.7rem;margin:6px 0}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}
.tile{border:0;border-radius:18px;padding:18px 8px;cursor:pointer;font-weight:700;font-size:1.05rem;display:flex;flex-direction:column;align-items:center;gap:6px}
.tile .e{font-size:2.3rem}
.tile.bleu{background:var(--bleu-bg);color:var(--bleu)}
.tile.rose{background:var(--rose-bg);color:var(--rose)}
.dots{display:flex;justify-content:center;gap:14px;margin:18px 0}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.dots i.f{background:var(--ink);border-color:var(--ink)}
.keypad{display:grid;grid-template-columns:repeat(3,76px);gap:12px;justify-content:center}
.keypad button{height:64px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:1.5rem;cursor:pointer}
.keypad button.v{visibility:hidden}
.linkbtn{background:none;border:0;color:var(--accent);text-decoration:underline;cursor:pointer;margin-top:14px;font-size:.92rem}
.center{text-align:center;padding:40px 0}
</style>
</head>
<body>
<div id="app"><div class="center muted">Chargement…</div></div>
<nav id="nav" hidden>
  <button data-a="tab" data-tab="auj"><span>🏠</span>Accueil</button>
  <button data-a="tab" data-tab="sem"><span>📅</span>Semaine</button>
  <button data-a="tab" data-tab="repas"><span>🍽️</span>Repas</button>
  <button data-a="tab" data-tab="epi"><span>🛒</span>Épicerie</button>
  <button data-a="tab" data-tab="fam"><span>👪</span>Famille</button>
  <button data-a="tab" data-tab="moi"><span>⚙️</span>Moi</button>
</nav>
<div id="sheet" class="sheet" hidden><div class="sheet-bg" data-a="close"></div><div class="sheet-card" id="sheet-card"></div></div>
<div id="dialogue" class="dlg" hidden><div class="dlg-bg" data-dlg="non"></div>
  <div class="dlg-card" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t" aria-describedby="dlg-m">
    <div class="dlg-t" id="dlg-t"></div><div class="dlg-m" id="dlg-m"></div>
    <div class="dlg-b"><button type="button" class="btn neutre" data-dlg="non">Annuler</button><button type="button" class="btn ghost" data-dlg="oui">OK</button></div>
  </div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* =====================================================================
   Repas en famille — application (une seule page)
   Données : Supabase (voir supabase.sql) ou mode démo local.
   ===================================================================== */
const CFG = window.CONFIG || {};
const DEMO = !(CFG.supabaseUrl && CFG.supabaseKey);
const CLE_SESSION = DEMO ? 'repas-session-demo' : 'repas-session';
const TZ = 'America/Toronto'; // fuseau du Québec
const $ = s => document.querySelector(s);
const LS = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const liste = s => String(s || '').split(',').map(x => x.trim()).filter(Boolean);
const isCustomEmoji = v => /^data:image\//i.test(String(v || '')) || /^https?:\/\//i.test(String(v || ''));
const emojiPermis = v => {
  const t = String(v || '').trim();
  return !!t && !/^(data:|http)/i.test(t) && [...t].length <= 16;
};
const renderEmoji = (v, alt = 'emoji') => {
  const value = String(v || '').trim();
  if (!value) return '🙂';
  if (isCustomEmoji(value)) return `<img class="custom-emoji" src="${value}" alt="${esc(alt)}">`;
  return esc(value);
};
const EMOJI_CHOICES = [
  '🙂','😊','😀','😄','😁','😎','🤩','😇','😜','🤠',
  '👶🏻','👶🏼','👶🏽','👶🏾','👶🏿',
  '👧🏻','👧🏼','👧🏽','👧🏾','👧🏿',
  '👦🏻','👦🏼','👦🏽','👦🏾','👦🏿',
  '🧑🏻','🧑🏼','🧑🏽','🧑🏾','🧑🏿',

/* ---------- Dates (toujours à l'heure du Québec) ---------- */
const _fp = new Intl.DateTimeFormat('en-CA', {timeZone:TZ, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hourCycle:'h23'});
function local(d){
  const p = {};
  for (const x of _fp.formatToParts(d ? new Date(d) : new Date())) p[x.type] = x.value;
  return {date:`${p.year}-${p.month}-${p.day}`, h:+p.hour, min:+p.minute, stamp:`${p.year}-${p.month}-${p.day} ${p.hour}:${p.minute}`};
}
const today = () => local().date;
function addDays(iso, n){ const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0,10); }
const _fl = new Intl.DateTimeFormat('fr-CA', {timeZone:'UTC', weekday:'long', day:'numeric', month:'long'});
const _fs = new Intl.DateTimeFormat('fr-CA', {timeZone:'UTC', weekday:'short'});
const jourLong = iso => _fl.format(new Date(iso + 'T12:00:00Z'));
const jourAbr = iso => _fs.format(new Date(iso + 'T12:00:00Z')).replace('.', '');
const _fw = new Intl.DateTimeFormat('fr-CA', {timeZone:'UTC', weekday:'long'});
const jourSemaine = iso => _fw.format(new Date(iso + 'T12:00:00Z')); // « vendredi »
const jourNum = iso => +iso.slice(8,10);
function heure(ts){ if (!ts) return ''; const l = local(ts); return `${l.h}h${String(l.min).padStart(2,'0')}`; }
function relJour(iso){
  const t = today();
  if (iso === t) return "aujourd'hui";
  if (iso === addDays(t,1)) return 'demain';
  if (iso === addDays(t,-1)) return 'hier';
  return jourLong(iso);
}
function quand(ts){ const l = local(ts); return `${relJour(l.date)} à ${heure(ts)}`; }

/* ---------- Profils : aliments et catégories pour les alertes ---------- */
const MER_POISSONS = ['poisson','saumon','thon','morue','aiglefin','tilapia','truite','sole','sardine','maquereau','fletan','goberge','anchois','hareng','espadon','omble','basa','fish'];
const MER_FRUITS = ['fruits de mer','crevette','homard','crabe','moule','petoncle','calmar','pieuvre','poulpe','huitre','palourde','langoustine','scampi','surimi'];
const MER_PLATS = ['sushi','paella','bouillabaisse','chaudree','fish and chips'];
const CATS = {
  'tout ce qui vient de la mer': [...MER_POISSONS, ...MER_FRUITS, ...MER_PLATS],
  'mer': [...MER_POISSONS, ...MER_FRUITS, ...MER_PLATS],
  'fruits de mer': [...MER_FRUITS, 'paella', 'bouillabaisse', 'chaudree'],
  'poisson': [...MER_POISSONS, 'sushi', 'fish and chips'],
  'porc': ['porc','jambon','bacon','lardon','saucisse','chorizo','pepperoni','prosciutto','pancetta','salami','cote levee','cotes levees','ribs','pulled pork','cretons','tourtiere','carbonara','rillettes'],
  'ragout': ['ragout','mijote','bourguignon','pot-au-feu','pot au feu','bouilli','goulash','blanquette','navarin','civet','cassoulet'],
  'noix': ['noix','amande','noisette','pacane','cajou','pistache','pignon','pesto','nutella','praline','macadamia'],
  'arachide': ['arachide','beurre d\'arachide','peanut','satay','pad thai'],
  'gluten': ['gluten','ble','farine','pain','pates','spaghetti','lasagne','macaroni','pizza','couscous','orge','seigle','biscuit','chapelure','pane','tortilla','wrap','nouilles','gateau','croute','sous-marin','burger','hamburger'],
  'lactose': ['lait','lactose','fromage','creme','beurre','yogourt','yaourt','mozzarella','parmesan','cheddar','feta','ricotta','gratin','poutine','alfredo','raclette'],
  'oeuf': ['oeuf','omelette','mayonnaise','quiche','frittata','carbonara','meringue']
};
CATS['poissons'] = CATS['poisson']; CATS['ragouts'] = CATS['ragout']; CATS['arachides'] = CATS['arachide'];
CATS['produits laitiers'] = CATS['lactose']; CATS['oeufs'] = CATS['oeuf'];
const norm = s => String(s || '').toLowerCase().replace(/œ/g,'oe').replace(/æ/g,'ae').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’`]/g,"'");
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function trouve(texte, terme){
  const n = norm(terme).trim();
  if (!n) return null;
  for (const w0 of [...(CATS[n] || []), n]){
    let w = w0;
    if (w.length > 4 && /[sx]$/.test(w)) w = w.slice(0,-1); // pluriel
    if (new RegExp('(^|[^a-z0-9])' + reEsc(w)).test(texte)) return w0;
  }
  return null;
}
function drapeaux(txt, p){
  const t = norm(txt), r = {all:[], dis:[]};
  for (const a of p.allergies || []){ const w = trouve(t, a); if (w) r.all.push({terme:a, mot:w}); }
  for (const a of p.naime_pas || []){ const w = trouve(t, a); if (w) r.dis.push({terme:a, mot:w}); }
  return r;
}

/* Les alertes s'écrivent en phrases : « Nadine n'aime pas le porc — jambon dans le repas ».
   Certains dégoûts contiennent déjà leur déterminant (« tout ce qui vient de la mer ») : on
   n'en ajoute pas. */
const DETERMINANT = /^(tout|tous|toute|toutes|le|la|les|l'|du|de|des|un|une|mon|ma|mes)\b/;
const avecArticle = t => DETERMINANT.test(norm(t)) ? t : (/[sx]$/.test(t) && t.length > 3 ? `les ${t}` : `le ${t}`);
// trouve() enleve le « s » du pluriel : « arachides » et « arachide » sont le meme mot.
const racine = s => { const n = norm(s).trim(); return n.length > 4 && /[sx]$/.test(n) ? n.slice(0, -1) : n; };
const dansLeRepas = x => racine(x.terme) === racine(x.mot) ? '' : ` — ${x.mot} dans le repas`;
const phraseGout = (nom, x) => `🚩 ${nom} n'aime pas ${avecArticle(x.terme)}${dansLeRepas(x)}`;
const phraseAllergie = (nom, x) => `⚠️ Allergie : ${nom} ne peut pas manger ${avecArticle(x.terme)}${dansLeRepas(x)}`;
const texteRepas = s => `${s.titre} ${s.ingredients || ''}`;
// Banque de repas : même clé anti-doublon que _cle_plat dans supabase.sql
// (minuscules, sans accents ni ponctuation, sans petits mots, mots de plus de 4 lettres au singulier).
const MOTS_VIDES = new Set(['a','au','aux','de','du','des','d','la','le','les','l','et','en','un','une']);
const motsDe = s => norm(s).replace(/[^a-z0-9]+/g, ' ').trim().split(' ').filter(Boolean);
const singulier = w => w.length > 4 && /[sx]$/.test(w) ? w.slice(0, -1) : w;
const clePlat = s => motsDe(s).filter(w => !MOTS_VIDES.has(w)).map(singulier).join(' ');

/* =====================================================================
   Accès aux données
   ===================================================================== */
async function rpc(fn, args = {}){
  try {
    if (DEMO) { await null; return Demo.call(fn, args); }
    const r = await fetch(`${CFG.supabaseUrl.replace(/\/$/,'')}/rest/v1/rpc/${fn}`, {
      method:'POST', headers:{apikey:CFG.supabaseKey, 'Content-Type':'application/json'}, body:JSON.stringify(args)
    });
    const txt = await r.text();
    let js = null; try { js = txt ? JSON.parse(txt) : null; } catch(e){}
    if (!r.ok) throw new Error((js && (js.message || js.hint)) || txt || ('Erreur ' + r.status));
    return js;
  } catch(e){
    if (/SESSION_INVALIDE|invalid input syntax for type uuid/.test(e.message)) { deconnecterLocal(); throw new Error('Ta session a expiré. Reconnecte-toi.'); }
    if (/Failed to fetch|NetworkError|Load failed/i.test(e.message)) throw new Error('Pas de connexion Internet.');
    throw e;
  }
}
async function act(fn, args, okMsg){
  try {
    await rpc(fn, {p_jeton:S.sess.jeton, ...args});
    if (okMsg) toast(okMsg);
    await refresh();
    return true;
  } catch(e){ toast('⚠️ ' + e.message, 5000); return false; }
}

      const horaire = {jour:p_jour, heure:p_heure};
      if (i >= 0) db.horaires_souper[i] = horaire; else db.horaires_souper.push(horaire);
      log(m.id, m.id, p_jour, `Heure du souper fixée à ${p_heure}`);
      return null;
    },
    enregistrer_presence({p_jeton, p_membre, p_jour, p_champ, p_valeur}){
      const m = qui(p_jeton);
      if (m.id !== p_membre && !m.parent) err('Tu ne peux modifier que ta propre présence.');
      if (p_jour < today()) err('Cette journée est passée.');
      if (!LIB[p_champ] || !LIB[p_champ][p_valeur]) err('Valeur invalide.');
      let p = db.presences.find(x => x.jour === p_jour && x.membre === p_membre);
      if (!p){ p = {jour:p_jour, membre:p_membre, souper:null, lunch:null}; db.presences.push(p); }
      const ancien = p[p_champ];
      if (ancien === p_valeur) return null;
      p[p_champ] = p_valeur; p[p_champ + '_maj'] = now(); p[p_champ + '_par'] = m.id;
      const txt = `${p_champ === 'souper' ? 'Souper' : 'Lunch'} du ${jourLong(p_jour)} : ${LIB[p_champ][p_valeur]}`;
      log(m.id, p_membre, p_jour, txt);
      if ((p_champ === 'souper' && ancien === 'present' && p_valeur === 'absent') ||
          (p_champ === 'lunch' && (ancien === 'froid' || ancien === 'chaud') && p_valeur === 'aucun'))
        notifParents(`❌ ${M(p_membre).prenom} annule`, `${txt} (à ${heure(now())})`);
      return null;
    },
    enregistrer_invite({p_jeton, p_id, p_jour, p_nom, p_allergies, p_naime_pas}){
      const m = qui(p_jeton);
      if (!p_nom) err('Indique le nom de la personne invitée.');
      if (p_jour < today()) err('Cette journée est passée.');
      db.invites.push({id:uid(), jour:p_jour, nom:p_nom, allergies:p_allergies || [], naime_pas:p_naime_pas || [], invite_par:m.id, cree:now()});
      log(m.id, m.id, p_jour, `Invité(e) au souper du ${jourLong(p_jour)} : ${p_nom}`);
      return null;
    },
    supprimer_invite({p_jeton, p_id}){
      const m = qui(p_jeton); const g = db.invites.find(x => x.id === p_id); if (!g) return null;
      if (g.invite_par !== m.id && !m.parent) err('Seule la personne qui a invité ou un parent peut retirer cet invité.');
      db.invites = db.invites.filter(x => x.id !== p_id);
      log(m.id, g.invite_par, g.jour, `Invité(e) retiré(e) du souper du ${jourLong(g.jour)} : ${g.nom}`);
      return null;
    },
    proposer_repas({p_jeton, p_jour, p_titre, p_ingredients, p_choisir}){
      const m = qui(p_jeton);
      if (!p_titre) err('Indique le nom du repas.');
      if (p_jour < today()) err('Cette journée est passée.');
      const s = {id:uid(), jour:p_jour, titre:p_titre, ingredients:p_ingredients || '', propose_par:m.id, cree:now(), choisi:false, choisi_par:null, choisi_le:null, plat:platPourDans(db, m.id, p_titre, p_ingredients)};
      db.suggestions.push(s);
      log(m.id, m.id, p_jour, `Suggestion pour le souper du ${jourLong(p_jour)} : ${p_titre}`);
      if (p_choisir) choisir(m, s);
      return s.id;
    },
    choisir_repas({p_jeton, p_id}){ const m = qui(p_jeton); const s = db.suggestions.find(x => x.id === p_id); if (!s) err('Suggestion introuvable.'); choisir(m, s); return null; },
    retirer_choix({p_jeton, p_jour}){
      const m = qui(p_jeton); if (!m.parent) err('Seuls Nadine et Marc peuvent changer le repas officiel.');
      const cur = db.suggestions.find(x => x.jour === p_jour && x.choisi); if (!cur) return null;
      if (prioDe(cur.choisi_par) > m.priorite) err(`Le choix de ${M(cur.choisi_par).prenom} a priorité.`);
      cur.choisi = false; cur.choisi_par = null; cur.choisi_le = null;
      log(m.id, m.id, p_jour, `Choix de repas retiré pour le ${jourLong(p_jour)} : ${cur.titre}`);
      return null;
    },
    supprimer_suggestion({p_jeton, p_id}){
      const m = qui(p_jeton); const s = db.suggestions.find(x => x.id === p_id); if (!s) return null;
      if (s.propose_par !== m.id && !m.parent) err('Seule la personne qui a suggéré ou un parent peut supprimer.');
      if (s.choisi && !m.parent) err('Ce repas est déjà choisi; seul un parent peut le retirer.');
      if (s.choisi && prioDe(s.choisi_par) > m.priorite) err(`Le choix de ${M(s.choisi_par).prenom} a priorité.`);
      db.suggestions = db.suggestions.filter(x => x.id !== p_id);
      db.votes = db.votes.filter(v => v.suggestion !== p_id);
      log(m.id, s.propose_par, s.jour, `Suggestion supprimée pour le ${jourLong(s.jour)} : ${s.titre}`);
      return null;
    },
    // Même règle que supabase.sql : un vote par personne et par jour, fermé dès qu'un repas officiel est choisi.
    voter_repas({p_jeton, p_id}){
      const m = qui(p_jeton); const s = db.suggestions.find(x => x.id === p_id); if (!s) err('Suggestion introuvable.');
      if (s.jour < today()) err('Cette journée est passée.');
      if (db.suggestions.some(x => x.jour === s.jour && x.choisi)) err('Le repas officiel de ce jour est déjà choisi : le vote est fermé.');
      db.votes = db.votes.filter(v => !(v.jour === s.jour && v.membre === m.id));
      db.votes.push({jour:s.jour, membre:m.id, suggestion:s.id, quand:now()});
      return null;
    },
    retirer_vote({p_jeton, p_jour}){
      const m = qui(p_jeton);
      if (p_jour < today()) err('Cette journée est passée.');
      if (db.suggestions.some(x => x.jour === p_jour && x.choisi)) err('Le repas officiel de ce jour est déjà choisi : le vote est fermé.');
      db.votes = db.votes.filter(v => !(v.jour === p_jour && v.membre === m.id));
      return null;
    },
    // Banque de repas (mêmes règles et messages que supabase.sql)
    enregistrer_plat({p_jeton, p_id, p_nom, p_ingredients, p_articles}){
      const m = qui(p_jeton), nom = String(p_nom || '').trim(), k = clePlat(nom);
      if (!nom || !k) err('Indique le nom du repas.');
      if (nom.length > 80) err('Le nom du repas est trop long (80 caractères au maximum).');
      const autre = db.plats.find(x => x.cle === k && x.id !== p_id);
      if (autre) err(`${autre.nom} est déjà dans la banque.`);
      let pl;
      if (!p_id){ pl = {id:uid(), nom, cle:k, ingredients:'', articles:[], cree_par:m.id}; db.plats.push(pl); }
      else { pl = db.plats.find(x => x.id === p_id); if (!pl) err('Ce repas n\'est plus dans la banque.'); }
      Object.assign(pl, {nom, cle:k, ingredients:String(p_ingredients || '').trim().slice(0, 200)});
      if (p_articles){
        if (p_articles.length > 60) err('Trop d\'articles (60 au maximum).');
        pl.articles = p_articles.map(a => String(a || '').trim().slice(0, 120)).filter(Boolean);
      }
      return pl.id;
    },
    ajouter_plats({p_jeton, p_noms}){
      const m = qui(p_jeton), noms = p_noms || [];
      if (noms.length > 200) err('Trop de repas d\'un coup (200 au maximum).');
      let ajoutes = 0; const existants = [], vus = new Set();
      for (const brut of noms){
        const nom = String(brut || '').trim().slice(0, 80), k = clePlat(nom);
        if (!k || vus.has(k)) continue; vus.add(k);
        const ex = db.plats.find(x => x.cle === k);
        if (ex) existants.push(ex.nom);
        else { db.plats.push({id:uid(), nom, cle:k, ingredients:'', articles:[], cree_par:m.id}); ajoutes++; }
      }
      return {ajoutes, existants};
    },
    supprimer_plat({p_jeton, p_id}){
      const m = qui(p_jeton); if (!m.parent) err('Seuls les parents peuvent retirer un repas de la banque.');
      db.plats = db.plats.filter(x => x.id !== p_id);
      for (const s of db.suggestions) if (s.plat === p_id) s.plat = null;
      return null;
    },
    enregistrer_profil({p_jeton, p_membre, p_emoji, p_aime, p_naime_pas, p_allergies}){
      const m = qui(p_jeton); if (m.id !== p_membre && !m.parent) err('Tu ne peux modifier que ton propre profil.');
      const c = M(p_membre); Object.assign(c, {emoji:verifEmoji(p_emoji) || c.emoji, aime:p_aime || '', naime_pas:p_naime_pas || [], allergies:p_allergies || []});
      log(m.id, p_membre, null, `Profil de ${c.prenom} mis à jour`);
      return null;
    },
    changer_nip({p_jeton, p_nouveau}){ const m = qui(p_jeton); if (!/^\d{4}$/.test(p_nouveau)) err('Le NIP doit contenir 4 chiffres.'); m.nip = p_nouveau; return null; },
    reinitialiser_nip({p_jeton, p_membre}){
      const m = qui(p_jeton); if (!m.parent) err('Seuls les parents peuvent réinitialiser un NIP.');
      const c = M(p_membre); c.nip = null;
      for (const k in db.sessions) if (db.sessions[k] === p_membre) delete db.sessions[k];
      log(m.id, p_membre, null, `NIP de ${c.prenom} réinitialisé`);
      return null;
    },
    deconnexion({p_jeton}){ delete db.sessions[p_jeton]; return null; }
  };
  return {
    call(fn, args){ if (!F[fn]) err('Fonction inconnue : ' + fn); const r = F[fn](args || {}); save(); return r; },
    reset(){ db = seed(); save(); }
  };
})();

const S = {sess:LS.get(CLE_SESSION), data:null, tab:LS.get('repas-onglet') || 'auj', repasJour:null, semaine:0, sheet:null, modif:false, autres:{}, epiJours:null, banqueQ:''};
const membre = id => S.data.membres.find(m => m.id === id);
const prenom = id => (membre(id) || {}).prenom || id || '?';
const moi = () => membre(S.data.moi);
const peut = id => id === S.data.moi || moi().parent;
const pres = (j, id) => S.data.presences.find(p => p.jour === j && p.membre === id);
const presenceMaison = (j, id) => (S.data.presence_maison || []).find(p => p.jour === j && p.membre === id);
const invitesDu = j => S.data.invites.filter(g => g.jour === j).sort((a,b) => a.cree < b.cree ? -1 : 1);
const suggDu = j => S.data.suggestions.filter(s => s.jour === j).sort((a,b) => a.cree < b.cree ? -1 : 1);
const repasChoisi = j => S.data.suggestions.find(s => s.jour === j && s.choisi);
// Votes : qui a voté pour une suggestion (dans l'ordre de la famille), et mon vote du jour.
const votantsDe = id => S.data.membres.filter(m => (S.data.votes || []).some(v => v.suggestion === id && v.membre === m.id));
const monVote = j => (S.data.votes || []).find(v => v.jour === j && v.membre === S.data.moi);
const voteOuvert = j => j >= today() && !repasChoisi(j);
// Banque de repas
const platsTries = () => [...(S.data.plats || [])].sort((a, b) => a.nom.localeCompare(b.nom, 'fr'));
const platParId = id => (S.data.plats || []).find(x => x.id === id);
// Le repas de la banque d'une suggestion : par son lien, sinon par la clé de son nom.
const platDe = s => platParId(s.plat) || (clePlat(s.titre) ? (S.data.plats || []).find(x => x.cle === clePlat(s.titre)) : null);
// Recherche dans la banque : chaque mot tapé doit être le début d'un mot (accents, majuscules et
// pluriel ignorés ; petits mots ignorés sauf le dernier, qu'on est peut-être en train d'écrire).
// D'abord les repas trouvés par leur NOM, puis ceux trouvés par leurs INGRÉDIENTS.
function chercherPlats(q){
  const brut = motsDe(q);
  const mots = brut.filter((w, i) => i === brut.length - 1 || !MOTS_VIDES.has(w)).map(singulier);
  if (!mots.length) return [];
  const couvre = liste => mots.every(m => liste.some(w => w.startsWith(m)));
  const k = clePlat(q), nom = [], ingr = [];
  for (const pl of platsTries()){
    const mn = motsDe(pl.nom);
    if (couvre(mn)) nom.push(pl);
    else if (couvre([...mn, ...motsDe(pl.ingredients)])) ingr.push(pl);
  }
  nom.sort((a, b) => (b.cle === k) - (a.cle === k));   // le repas identique en premier
  return [...nom, ...ingr];
}
// Sous le champ « Repas » : les repas semblables de la banque, à toucher pour les choisir.
function htmlChoixBanque(q){
  const t = String(q || '').trim(); if (!t) return '';
  const k = clePlat(t), trouves = chercherPlats(t), exact = k && (S.data.plats || []).find(x => x.cle === k);
  if (!trouves.length) return '<div class="small choix-info">✨ Nouveau repas : il sera ajouté à la banque.</div>';
  const vus = trouves.slice(0, 8);
  return `<div class="small choix-info">${exact ? '✓ Déjà dans la banque.' : 'Dans la banque (touche pour choisir) :'}</div>
    <div class="choix-liste">${vus.map(pl => `<button type="button" class="choix${exact && pl.id === exact.id ? ' on' : ''}" data-a="choisir-plat" data-id="${pl.id}"><b>${esc(pl.nom)}</b>${pl.ingredients ? `<span class="small"> · ${esc(pl.ingredients)}</span>` : ''}</button>`).join('')}</div>
    ${trouves.length > 8 ? `<div class="small">… et ${trouves.length - 8} autre${trouves.length - 8 > 1 ? 's' : ''} : précise ta recherche.</div>` : ''}
    ${exact ? '' : '<div class="small choix-info">Pas dans la liste ? Continue d’écrire : le repas sera ajouté à la banque.</div>'}`;
}
// Liste de la fenêtre « Banque de repas » (filtrée par la recherche).
function listeBanque(q){
  const tous = platsTries();
  if (!tous.length) return '<p class="muted">La banque est vide. Ajoute tes premiers repas !</p>';
  const liste = String(q || '').trim() ? chercherPlats(q) : tous;
  if (!liste.length) return `<p class="muted">Aucun repas ne correspond.</p><button type="button" class="btn ghost sm" data-a="plat-nouveau" data-nom="${esc(q.trim())}">➕ Ajouter « ${esc(q.trim())} »</button>`;

}
const boutonPanier = j => `<button type="button" class="btn-icone panier" data-a="panier" data-j="${j}" aria-label="Liste d’épicerie pour ce souper">🛒</button>`;
const heureSouper = j => (S.data.horaires_souper || []).find(x => x.jour === j)?.heure || '';

function resumePresenceMaison(j, id){
  const p = presenceMaison(j, id), heure = heureSouper(j);
  if (!p) return {texte:'', alerte:''};
  const texte = p.arrivee && p.depart ? `${p.arrivee} → ${p.depart}` : p.arrivee ? `arrive à ${p.arrivee}` : `part à ${p.depart}`;
  if (!heure) return {texte, alerte:''};
  if (p.arrivee && heure < p.arrivee) return {texte, alerte:'⚠️ arrive après le souper'};
  if (p.depart && heure > p.depart) return {texte, alerte:'⚠️ part avant le souper'};
  return {texte, alerte:''};
}

function statutSouper(j, id){
  const p = pres(j, id);
  if (p && p.souper) return {v:p.souper, maj:p.souper_maj, par:p.souper_par, tard:local(p.souper_maj).stamp >= limiteSouper(j)};
  return {v: estPasse(limiteSouper(j)) ? 'auto' : 'attente'};
}
function statutLunch(j, id){
  const p = pres(j, id);
  if (p && p.lunch) return {v:p.lunch, maj:p.lunch_maj, par:p.lunch_par, tard:local(p.lunch_maj).stamp >= limiteLunch(j)};
  return {v: estPasse(limiteLunch(j)) ? 'auto' : 'attente'};
}
function convives(j){
  const r = [];
  for (const m of S.data.membres){ const v = statutSouper(j, m.id).v; if (v === 'present' || v === 'attente') r.push({label:m.prenom, allergies:m.allergies, naime_pas:m.naime_pas}); }
  for (const g of invitesDu(j)) r.push({label:g.nom + ' (invité)', allergies:g.allergies, naime_pas:g.naime_pas});
  return r;
}

/* ---------- Cartes réutilisables ---------- */
function carteSouper(j){
  const r = repasChoisi(j), sug = suggDu(j), gs = invitesDu(j);
  const heure = heureSouper(j);
  const ordre = {present:0, attente:1, absent:2, auto:3};
  const lignes = S.data.membres.map(m => ({m, st:statutSouper(j, m.id)})).sort((a,b) => ordre[a.st.v] - ordre[b.st.v]);
  const nP = lignes.filter(x => x.st.v === 'present').length, nA = lignes.filter(x => x.st.v === 'attente').length;
  const txt = r ? texteRepas(r) : '';
  let repas;
  if (r) repas = `<div class="meal"><div class="meal-t">🍽️ ${esc(r.titre)}</div>${r.ingredients ? `<div class="small">${esc(r.ingredients)}</div>` : ''}<div class="small">Suggéré par ${esc(prenom(r.propose_par))} · choisi par ${esc(prenom(r.choisi_par))}</div></div>`;
  else if (sug.length) repas = `<div class="meal pending tap" data-a="goto-repas" data-j="${j}">🤔 <b>Repas à décider</b> — ${sug.length} suggestion${sug.length > 1 ? 's' : ''} : ${sug.map(s => esc(s.titre)).join(', ')} ›</div>`;
  else repas = `<div class="meal pending tap" data-a="goto-repas" data-j="${j}">Aucun repas prévu — <b>suggérer un repas</b> ›</div>`;
  return `<div class="card"><h3>🍽️ Souper · ${cap(relJour(j))}</h3><div class="small dinner-time">${heure ? `🕒 Souper prévu à <b>${esc(heure)}</b>` : '🕒 Heure du souper pas encore fixée'}</div>${repas}
    <div class="count"><b>${nP + gs.length}</b> personne${nP + gs.length > 1 ? 's' : ''} au souper${gs.length ? ` (${nP} + ${gs.length} invité${gs.length > 1 ? 's' : ''})` : ''}${nA ? ` · <span class="late">${nA} pas encore répondu</span>` : ''}</div>
    <div class="list">${lignes.map(x => ligneMembre(j, x.m, x.st, txt)).join('')}${gs.map(g => ligneInvite(j, g, txt)).join('')}</div>
    ${j >= today() ? `<button class="btn ghost sm" data-a="invite" data-j="${j}">➕ Ajouter un invité</button>` : ''}

}
function ligneMembre(j, m, st, txt){
  const ed = j >= today() && peut(m.id);
  const f = txt && (st.v === 'present' || st.v === 'attente') ? drapeaux(txt, m) : null;
  const icones = f ? (f.all.length ? ' ⚠️' : '') + (f.dis.length ? ' 🚩' : '') : '';
  const maison = st.v === 'present' || st.v === 'attente' ? resumePresenceMaison(j, m.id) : {texte:'', alerte:''};
  return `<div class="row${ed ? ' tap' : ''}" ${ed ? `data-a="person" data-m="${m.id}" data-j="${j}"` : ''}>
    ${nomTag(m)}${icones}<span class="grow"></span>${st.tard ? `<span class="late small">⏰ ${heure(st.maj)}</span>` : ''}${pill(st.v, m)}${ed ? '<span class="chev">›</span>' : ''}
    ${maison.texte ? `<div class="flags home-range"><span class="small">🏠 ${esc(maison.texte)}</span>${maison.alerte ? `<span class="flag all">${maison.alerte}</span>` : ''}</div>` : ''}
    ${f && (f.all.length || f.dis.length) ? `<div class="flags">${htmlFlags(f, m.prenom)}</div>` : ''}</div>`;
}
function ligneInvite(j, g, txt){
  const f = txt ? drapeaux(txt, g) : null;
  const tard = local(g.cree).stamp >= limiteSouper(j);
  const ed = j >= today() && (g.invite_par === S.data.moi || moi().parent);
  const info = [g.allergies && g.allergies.length ? 'allergies : ' + g.allergies.join(', ') : '', g.naime_pas && g.naime_pas.length ? "n'aime pas : " + g.naime_pas.join(', ') : ''].filter(Boolean).join(' · ');
  return `<div class="row"><span class="who invite">🎟️ ${esc(g.nom)}</span>${f && f.all.length ? ' ⚠️' : ''}${f && f.dis.length ? ' 🚩' : ''}
    <span class="grow"></span>${ed ? `<button class="btn danger sm" data-a="del-invite" data-id="${g.id}">Retirer</button>` : ''}
    <div class="flags"><span class="small">Invité(e) par <b>${esc(prenom(g.invite_par))}</b> · ajouté ${quand(g.cree)}${tard ? ` <span class="late">⏰ après ${HL()}h</span>` : ''}</span>
    ${info ? `<span class="small">${esc(info)}</span>` : ''}${f ? htmlFlags(f, g.nom + ' (invité)') : ''}</div></div>`;
}
function carteLunch(j){
  const gr = {froid:[], chaud:[], attente:[], aucun:[]};
  for (const m of S.data.membres){ const st = statutLunch(j, m.id); gr[st.v === 'auto' ? 'aucun' : st.v].push({m, st}); }
  const tagM = x => {
    const ed = j >= today() && peut(x.m.id);
    return `<span class="${ed ? 'tap' : ''}" ${ed ? `data-a="person" data-m="${x.m.id}" data-j="${j}"` : ''}>${nomTag(x.m)}${x.st.tard ? `<span class="late small"> ⏰ ${heure(x.st.maj)}</span>` : ''}${x.st.v === 'auto' ? '<span class="small"> (sans réponse)</span>' : ''}</span>`;
  };
  const grp = (lbl, a) => `<div class="lg"><div class="lg-t">${lbl} · <b>${a.length}</b></div><div class="tags">${a.length ? a.map(tagM).join('') : '<span class="small">personne</span>'}</div></div>`;
  return `<div class="card"><h3>🥪 Lunchs · ${cap(relJour(j))}</h3>
    ${grp("🥪 Froid (à l'école)", gr.froid)}${grp('🍲 Chaud (à la maison)', gr.chaud)}${gr.attente.length ? grp('⏳ Pas encore répondu', gr.attente) : ''}${grp('Pas de lunch', gr.aucun)}
    <div class="small" style="margin-top:6px">Le lunch se décide la veille, avant ${HL()}h.</div></div>`;
}
function ligneJournal(e){
  const p = membre(e.par);
  return `<div class="row"><div class="grow">${nomTag(p)}${e.membre && e.membre !== e.par ? ` <span class="small">pour ${esc(prenom(e.membre))}</span>` : ''}
    <div>${esc(e.texte)}</div><div class="small">${cap(quand(e.quand))}</div></div></div>`;
}
const carteJournal = n => S.data.journal.length ? `<div class="card"><h3>🕘 Derniers changements</h3><div class="list">${S.data.journal.slice(0, n).map(ligneJournal).join('')}</div></div>` : '';

/* =====================================================================
   Page d'accueil (niveau B)
   Principe : une seule zone pose les questions; le reste ne fait
   qu'informer. Les cartes détaillées (carteSouper, carteLunch) restent

/* Mots simples pour le résumé des réponses */
function motSouper(v, m){
  const e = m && m.couleur === 'rose' ? 'e' : '';
  return v === 'present' ? `présent${e}` : `absent${e}`;
}
const motLunch = v => ({froid:"lunch froid (à l'école)", chaud:'lunch chaud (à la maison)'})[v] || 'pas de lunch';

/* Une ligne verte quand les trois réponses ont vraiment été données */
function carteRepondu(t, dm, id){
  const m = membre(id);
  const s1 = statutSouper(t, id).v, lu = statutLunch(dm, id).v, s2 = statutSouper(dm, id).v;
  return `<div class="card done">
    <h3>✅ Tes réponses sont enregistrées</h3>
    <div>Ce soir : <b>${motSouper(s1, m)}</b> · Lunch demain : <b>${motLunch(lu)}</b> · Souper demain : <b>${motSouper(s2, m)}</b></div>
    <div class="actions"><button type="button" class="btn ok" data-a="modifier-reponses">Modifier</button></div>
  </div>`;
}

/* La zone des questions */
function carteQuestions(t, dm, id, manque){
  const titre = manque ? (local().h < HL() ? `À répondre avant ${HL()}h` : 'Il manque des réponses') : 'Mes réponses';
  return `<div class="card${manque ? ' todo' : ''}">
    <h3>✋ ${titre}</h3>
    ${blocReponse(id, t, 'souper', 'Soupes-tu ce soir ?')}
    ${blocReponse(id, dm, 'lunch', "Ton lunch demain ? <span class=\"small\">— 🥪 froid = à l'école · 🍲 chaud = à la maison</span>")}
    ${blocReponse(id, dm, 'souper', 'Soupes-tu demain ?')}
    <div class="actions"><button type="button" class="btn ghost" data-a="mes-heures">🏠 Mes heures à la maison <span class="chev">›</span></button></div>
    ${manque ? '' : '<div class="actions"><button type="button" class="btn ghost sm" data-a="replier-reponses">✓ Terminé</button></div>'}
  </div>`;
}

/* Les alertes du repas, en phrases */
function phrasesAlertes(j, txt){
  if (!txt) return '';
  const all = [], dis = [];
  for (const c of convives(j)){
    const f = drapeaux(txt, c);
    for (const x of f.all) all.push(`<span class="flag all">${esc(phraseAllergie(c.label, x))}</span>`);
    for (const x of f.dis) dis.push(`<span class="flag dis">${esc(phraseGout(c.label, x))}</span>`);
  }
  const out = [...all, ...dis];   // les allergies d'abord
  return out.length ? `<div class="flags">${out.join('')}</div>` : '';
}

/* Les heures à la maison qui tombent hors du souper, en phrases */
function phrasesMaison(j){
  const out = [];
  for (const m of S.data.membres){
    const v = statutSouper(j, m.id).v;
    if (v !== 'present' && v !== 'attente') continue;
    const r = resumePresenceMaison(j, m.id);
    if (r.alerte) out.push(`<span class="flag all">⚠️ ${esc(m.prenom)} ${esc(r.alerte.replace('⚠️ ', ''))}</span>`);
  }
  return out.length ? `<div class="flags">${out.join('')}</div>` : '';
}

/* Le bloc des lunchs, en résumé */
// Une catégorie : « ✅ Présents (2) » suivi des pastilles, et une note facultative en dessous.
function ligneCat(titre, n, pastilles, note = ''){
  return `<div class="line"><b>${titre} (${n})</b> ${pastilles}</div>${note ? `<div class="cat-n">${note}</div>` : ''}`;
}
const pastilles = (a, cls = '') => a.map(m => nomTag(m, cls)).join(' ');
// Lunchs d'un jour : qui en a un (école / maison), qui n'en veut pas, qui n'a pas répondu.
// « Pas répondu » (passé la limite = pas de lunch) est séparé de « Pas de lunch » (réponse donnée).
function resumeLunch(j){
  const gr = {froid:[], chaud:[], aucun:[], auto:[], attente:[]};
  for (const m of S.data.membres) gr[statutLunch(j, m.id).v].push(m);
  const lim = limTxt(limiteLunch(j)), l = [];
  if (!gr.froid.length && !gr.chaud.length) l.push('<div class="line">Aucun lunch à préparer.</div>');
  if (gr.froid.length) l.push(ligneCat("🥪 À l'école", gr.froid.length, pastilles(gr.froid)));
  if (gr.chaud.length) l.push(ligneCat('🍲 À la maison', gr.chaud.length, pastilles(gr.chaud)));
  if (gr.aucun.length) l.push(ligneCat('🚫 Pas de lunch', gr.aucun.length, pastilles(gr.aucun)));
  if (gr.auto.length) l.push(ligneCat('❓ Pas répondu', gr.auto.length, pastilles(gr.auto, 'attend'), `Pas de réponse avant ${lim} = pas de lunch.`));
  if (gr.attente.length) l.push(ligneCat('❓ En attente de réponse', gr.attente.length, pastilles(gr.attente, 'attend'), `Réponse attendue avant ${lim}.`));
  return `<div class="sub-h">🥪 Lunchs</div>${l.join('')}`;
}
// Souper d'un jour : combien, qui est présent (avec les invités), qui est absent, qui n'a pas répondu.
function resumeSouper(j, gs){
  const g = {present:[], absent:[], auto:[], attente:[]};
  for (const m of S.data.membres) g[statutSouper(j, m.id).v].push(m);
  const nP = g.present.length, nT = nP + gs.length, lim = limTxt(limiteSouper(j));
  const invites = gs.map(x => ` <span class="who invite">🎟️ ${esc(x.nom)}</span>`).join('');
  const l = [`<div class="count">🍽️ <b>Au souper : ${nT}</b>${gs.length ? ` (${nP} + ${gs.length} invité${gs.length > 1 ? 's' : ''})` : ''}</div>`];
  if (nT) l.push(ligneCat('✅ Présents', nT, pastilles(g.present) + invites));
  if (g.absent.length) l.push(ligneCat('❌ Absents', g.absent.length, pastilles(g.absent)));
  if (g.auto.length) l.push(ligneCat('❓ Pas répondu', g.auto.length, pastilles(g.auto, 'attend'), `Pas de réponse avant ${lim} = pas au souper.`));
  if (g.attente.length) l.push(ligneCat('❓ En attente de réponse', g.attente.length, pastilles(g.attente, 'attend'), `Réponse attendue avant ${lim}.`));
  return l.join('');
}

// Ligne des votes d'une suggestion : à gauche, le titre (facultatif) et qui en a envie ;
// à droite, mes boutons tant que le vote est ouvert. Les boutons passent à la ligne,
// alignés à droite, s'ils ne tiennent pas à côté (téléphone étroit).
// - Pas mon vote : « Mon choix » gris pâle (un toucher vote, ou déplace mon vote ici).
// - Mon vote : « 👍 Mon choix » vert, qui ne fait rien au toucher, puis « Retirer mon vote ».
// masquerVide : sur la carte du souper décidé (page Repas), rien si personne n'a voté.
// extra : boutons ajoutés à droite de ceux du vote (accueil : « Décider ce repas » et la poubelle, parents seulement).
function ligneVotes(j, s, titre = '', masquerVide = false, extra = ''){
  const qui = votantsDe(s.id), mien = monVote(j);
  if (masquerVide && !qui.length && !voteOuvert(j)) return '';
  const noms = qui.length ? `👍 <b>${qui.length}</b> ${qui.map(m => nomTag(m)).join(' ')}` : '<span class="small">Pas encore de vote</span>';
  let boutons = '';
  if (voteOuvert(j)){
    if (mien && mien.suggestion === s.id) boutons = `<button type="button" class="btn ok sm" aria-pressed="true">👍 Mon choix</button><button type="button" class="btn neutre sm" data-a="retirer-vote" data-j="${j}">Retirer mon vote</button>`;
    else boutons = `<button type="button" class="btn neutre sm" aria-pressed="false" data-a="voter" data-id="${s.id}">Mon choix</button>`;
  }
  boutons += extra;
  return `<div class="vote-row"><div class="vote-info">${titre}<div class="line">${noms}</div></div>${boutons ? `<div class="vote-btns">${boutons}</div>` : ''}</div>`;
}
// Accueil : zone du repas d'une carte de jour.
// - Repas officiel choisi : la boîte verte, et qui voulait quoi (le vote est fermé, aucun bouton).
// - Sinon : le bloc « Indique ta préférence » (s'il y a des suggestions), puis le bouton qui ouvre
//   la fenêtre de suggestion. L'heure du souper vient juste après, dans carteJourAccueil.
function zoneRepasAccueil(j, r, sug){
  if (r){
    const avec = sug.filter(s => votantsDe(s.id).length);
    return `<div class="meal meal-panier"><div class="grow"><div class="meal-t">🍽️ ${esc(r.titre)}</div>${r.ingredients ? `<div class="small">${esc(r.ingredients)}</div>` : ''}</div>${boutonPanier(j)}</div>`
      + avec.map(s => `<div class="line small">👍 ${esc(s.titre)} : ${esc(votantsDe(s.id).map(m => m.prenom).join(', '))}</div>`).join('');
  }
  const bouton = boutonSuggestion(j, sug);
  if (!sug.length) return bouton;
  return `<div class="vote-zone">
      <div class="vote-zone-t">Indique ta préférence</div>
      ${sug.length > 1 ? '<div class="small">Comme il y a plusieurs suggestions de repas, nous devons procéder par vote</div>' : ''}
      ${sug.map(s => `<div class="vote">${ligneVotes(j, s, `<div class="vote-t">${esc(s.titre)}</div>`, false, parentsAccueil(s))}</div>`).join('')}
    </div>${bouton}`;
}
// Poubelle en métal dessinée par l'app : l'emoji 🗑️ change d'allure d'un appareil à l'autre.
const ICONE_POUBELLE = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M5 6l1 14a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1l1-14"/><path d="M10 10v7M14 10v7"/></svg>';
const boutonPoubelle = s => `<button type="button" class="btn-icone" data-a="del-sugg" data-id="${s.id}" aria-label="Supprimer ${esc(s.titre)}">${ICONE_POUBELLE}</button>`;
// Accueil, parents seulement (le bloc n'existe que tant qu'aucun souper n'est décidé) :
// « Décider ce repas » puis la poubelle, mêmes actions que dans la page Repas.
function parentsAccueil(s){
  if (!moi().parent) return '';
  return `<button type="button" class="btn neutre sm" data-a="choisir" data-id="${s.id}">Décider ce repas</button>${boutonPoubelle(s)}`;
}
// Le bouton qui ouvre la fenêtre de suggestion (accueil et page Repas).
function boutonSuggestion(j, sug){
  return j >= today() ? `<button type="button" class="btn ghost full sugg-btn" data-a="suggerer" data-j="${j}">${sug.length ? 'Faire une autre suggestion de repas' : 'Faire une suggestion de repas'}</button>` : '';
}
/* Une carte de jour, en résumé (ce soir / demain) */
function carteJourAccueil(j, titre, avecLunch){
  const r = repasChoisi(j), sug = suggDu(j), gs = invitesDu(j);
  const txt = r ? texteRepas(r) : '';


  return `<div class="card">

      <div class="actions">

        ${j >= today() ? `<button type="button" class="btn ghost sm" data-a="invite" data-j="${j}">➕ Un invité</button>` : ''}
      </div>
      ${resumeSouper(j, gs)}
      ${phrasesAlertes(j, txt)}

}

function vueAccueil(){
  const t = today(), dm = addDays(t,1), id = S.data.moi, l = local();

  return `${enTete(`Bonjour ${esc(moi().prenom)} ${renderEmoji(moi().emoji, moi().prenom)}`, cap(jourLong(t)))}${bandeau}

function vueSemaine(){

        <div class="small" style="margin-top:4px">🍽️ ${r ? `<b style="color:var(--ink)">${esc(r.titre)}</b>` : sug.length ? `${sug.length} suggestion${sug.length > 1 ? 's' : ''} — à décider` : 'Repas pas encore prévu'}</div>
        <div class="small dinner-time">🕒 ${heure ? `Souper prévu à <b>${esc(heure)}</b>` : 'Heure du souper pas encore fixée'}</div>
        <div class="small">👥 ${nP + gs.length} au souper${gs.length ? ` (dont ${gs.length} invité${gs.length > 1 ? 's' : ''})` : ''}${nA ? ` · ${nA} en attente` : ''} · 🥪 ${nF} froid · 🍲 ${nC} chaud</div>
        <div class="mine"><span>Mon souper</span>${seg(id, j, 'souper', statutSouper(j, id).v, true, true)}

    }).join('')}
    <div class="small">Lunch : — aucun · 🥪 froid (à l'école) · 🍲 chaud (à la maison)</div>`;
}
function vueRepas(){
  const t = today();
  if (!S.repasJour || S.repasJour < t) S.repasJour = t;
  const jours = [...Array(14)].map((_, i) => addDays(t, i)), j = S.repasJour, sug = suggDu(j), parent = moi().parent;
  const heure = (S.data.horaires_souper || []).find(x => x.jour === j)?.heure || '';
  const conv = convives(j), r = repasChoisi(j);
  // Souper décidé : sa carte d'abord, les autres suggestions repliées (dépliables d'un toucher).
  let liste;
  if (!sug.length) liste = '<p class="muted">Aucune suggestion pour ce jour.</p>';
  else if (r){
    const autres = sug.filter(s => s.id !== r.id), ouvert = !!S.autres[j];
    liste = carteSugg(j, r, parent) + (autres.length
      ? `<button type="button" class="autres-toggle" data-a="autres" data-j="${j}" aria-expanded="${ouvert}">${ouvert ? '▾' : '▸'} Autres suggestions (${autres.length})</button>${ouvert ? autres.map(s => carteSugg(j, s, parent)).join('') : ''}`
      : '');
  } else liste = sug.map(s => carteSugg(j, s, parent)).join('');

// Carte d'une suggestion (page Repas), toujours dans le même ordre :
// nom + 🗑️ · suggéré/décidé par · alertes · votes + « Mon choix » · ligne « Parents : » (parents seulement).
function carteSugg(j, s, parent){
  const m = moi(), r = repasChoisi(j);
  const cp = s.choisi ? membre(s.choisi_par) : null;
  const cr = r ? membre(r.choisi_par) : null;
  const verrou = !!(cr && cr.priorite > m.priorite);          // souper décidé par un rang plus élevé
  const peutRetirer = parent && (!cp || cp.priorite <= m.priorite);
  const peutSupprimer = (s.propose_par === m.id && !s.choisi) || peutRetirer;
  const poubelle = peutSupprimer ? boutonPoubelle(s) : '';
  let action = '';
  if (parent){
    if (s.choisi) action = peutRetirer
      ? `<button type="button" class="btn ghost sm lp-b" data-a="retirer-choix" data-j="${j}">Annuler la décision</button>`
      : `<span class="small lp-b">🔒 Décidé par ${esc(prenom(s.choisi_par))}</span>`;
    else if (!verrou) action = `<button type="button" class="btn neutre sm lp-b" data-a="choisir" data-id="${s.id}">Décider ce repas</button>`;
  }
  return `<div class="sugg${s.choisi ? ' chosen' : ''}">
    <div class="sugg-h"><div>${s.choisi ? '<span class="tag ok">✅ C\'est le souper!</span>' : ''}<div class="meal-t">${esc(s.titre)}</div>${s.ingredients ? `<div class="small">${esc(s.ingredients)}</div>` : ''}</div>${poubelle}</div>
    <div class="small">Suggéré par <b>${esc(prenom(s.propose_par))}</b> ${quand(s.cree)}${s.choisi ? ` · décidé par <b>${esc(prenom(s.choisi_par))}</b> ${quand(s.choisi_le)}` : ''}</div>
    ${resumeFlags(j, texteRepas(s))}
    ${ligneVotes(j, s, '', !!s.choisi)}
    ${action ? `<div class="ligne-parents"><span class="lp-t">Parents :</span>${action}</div>` : ''}</div>`;
}

function vueEpicerie(){
  const t = today(), jours = [...Array(14)].map((_, i) => addDays(t, i));
  if (!S.epiJours) S.epiJours = [t];
  const choisis = jours.filter(x => S.epiJours.includes(x));
  const etiquette = x => `${cap(jourAbr(x))} ${jourNum(x)}`;
  const groupes = new Map();
  const soupers = choisis.map(j => {
    const r = repasChoisi(j), pl = r ? platDe(r) : null;
    if (pl) for (const a of pl.articles){
      const k = norm(a).replace(/\s+/g, ' ').trim();
      const g = groupes.get(k) || {texte:a, n:0, jours:[]};
      g.n++; g.jours.push(j); groupes.set(k, g);
    }
    let detail;
    if (!r) detail = '<span class="late">souper pas encore décidé</span>';
    else if (!pl) detail = `${esc(r.titre)} <span class="small">· pas dans la banque</span> <button type="button" class="btn ghost sm" data-a="plat-nouveau" data-nom="${esc(r.titre)}" data-retour="aucun">➕ Ajouter</button>`;
    else if (!pl.articles.length) detail = `${esc(r.titre)} <span class="small">· aucun article encore</span> <button type="button" class="btn ghost sm" data-a="plat" data-id="${pl.id}" data-retour="aucun">➕ Ajouter les articles</button>`;
    else detail = `${esc(r.titre)} <span class="small">· ${pl.articles.length} article${pl.articles.length > 1 ? 's' : ''}</span>`;
    return `<div class="epi-souper"><b>${etiquette(j)}</b> — ${detail}</div>`;

  const liste = [...groupes.values()].sort((a, b) => a.texte.localeCompare(b.texte, 'fr'));
  return `${enTete('Épicerie', 'Choisis un ou plusieurs jours : la liste regroupe les articles des soupers décidés.')}
    <div class="chips">${jours.map(x => `<button class="chip${choisis.includes(x) ? ' on' : ''}" data-a="epi-jour" data-j="${x}" aria-pressed="${choisis.includes(x)}">${cap(jourAbr(x))}<b>${jourNum(x)}</b><span class="dot">${repasChoisi(x) ? '✅' : ''}</span></button>`).join('')}</div>

    <div class="card"><h3>🛒 À acheter (${liste.length})</h3>${liste.length
      ? `<ul class="articles">${liste.map(g => `<li>${esc(g.texte)}${g.n > 1 ? ` <b>×${g.n}</b>` : ''}${choisis.length > 1 ? ` <span class="small">· ${g.jours.map(etiquette).join(', ')}</span>` : ''}</li>`).join('')}</ul>`
      : `<p class="muted">${choisis.length ? 'Aucun article pour ces soupers pour l’instant.' : 'Choisis des jours pour voir la liste.'}</p>`}</div>`;
